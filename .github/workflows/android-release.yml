name: Android release APK

# Builds a release APK on every push to main and publishes it to the rolling
# `latest-android` GitHub Release as `medicompare.apk`, so this link always
# serves the newest build:
#   https://github.com/<owner>/<repo>/releases/download/latest-android/medicompare.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.6 # matches local development; bump together
          cache: true

      # Optional stable signing key. Without these secrets the APK is signed with
      # the runner's throwaway debug key, so testers must uninstall before updating.
      - name: Set up release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      - run: flutter pub get

      - run: flutter analyze

      # The build number increases every run so Android accepts the new APK as an update.
      - name: Build APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Publish to the latest-android release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk medicompare.apk
          # Point the rolling tag at this commit.
          git tag -f latest-android
          git push -f origin refs/tags/latest-android
          notes="Latest Android test build from ${GITHUB_SHA::7} (run #${{ github.run_number }}).
          Install medicompare.apk, then open Account → Server address and enter your server, e.g. http://192.168.1.20:3000."
          if gh release view latest-android >/dev/null 2>&1; then
            gh release edit latest-android --title "Android test build" --notes "$notes" --prerelease
          else
            gh release create latest-android --title "Android test build" --notes "$notes" --prerelease --verify-tag
          fi
          gh release upload latest-android medicompare.apk --clobber
